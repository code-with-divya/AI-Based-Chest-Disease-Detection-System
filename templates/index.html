<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chest Disease Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            width: 420px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-box:hover {
            border-color: #fff;
        }

        input {
            display: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #00c6ff;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #0072ff;
        }

        img {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 10px;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
        }

        .normal {
            color: #00ff9d;
        }

        .cancer {
            color: #ff4d4d;
        }

        .loader {
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>AI Chest Disease Detector</h1>
    <p>Upload chest X-ray to detect disease using AI</p>

    <label class="upload-box">
        Click to Upload Image
        <input type="file" id="fileInput">
    </label>

    <button onclick="predict()">Predict</button>

    <div class="loader" id="loader">⏳ Processing...</div>

    <img id="preview"/>

    <div id="result" class="result"></div>
</div>

<script>
function predict() {
    const file = document.getElementById("fileInput").files[0];

    if (!file) {
        alert("Please upload image");
        return;
    }

    const reader = new FileReader();

    reader.onloadend = function () {
        const base64 = reader.result.split(',')[1];

        document.getElementById("loader").style.display = "block";
        document.getElementById("result").innerText = "";

        fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("loader").style.display = "none";

            let resultText = data[0].image;
            let resultDiv = document.getElementById("result");

            resultDiv.innerText = "Result: " + resultText;

            if (resultText.includes("Normal")) {
                resultDiv.className = "result normal";
            } else {
                resultDiv.className = "result cancer";
            }
        });
    };

    reader.readAsDataURL(file);
    document.getElementById("preview").src = URL.createObjectURL(file);
}
</script>

</body>
</html>
